welcomeTitle: Welcome to the Attentive Brains & Behaviors Lab
welcomeHeadline: Understanding Attention, from Brains to Behaviors
welcomeBody:
  - We are intrigued by how brains — human and animal — navigate an extremely
    complex world, and by the devastating consequences of brain diseases.
    Combining cutting-edge tools, multiple neuroscientific techniques, and
    different model systems, we study behavior at its full capacity to
    ultimately improve wellbeing.
researchTitle: Our research areas
researchCta: View all research
teamTitle: Our Team
teamBody:
  - We are a neuroscience lab at the University of Geneva studying how the brain
    selects, sustains and directs attention — in the laboratory, in the clinic,
    and in realistic everyday environments.
  - The lab is directed by Ilaria Sani and is composed of post-doctoral
    researchers, PhD students and master students.
